<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>NUMBER MARKET · GREEN CURTAIN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-color: #2e2a24; /* серокоричневатый фон */
            background-image: 
                repeating-linear-gradient(45deg, 
                    rgba(60, 55, 48, 0.3) 0px, 
                    rgba(60, 55, 48, 0.3) 2px, 
                    transparent 2px, 
                    transparent 8px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        }

        /* зелёная шторка — основной контейнер */
        .curtain {
            max-width: 1300px;
            width: 100%;
            background: #1f3b2a;  /* тёмно-зелёный фон шторки */
            padding: 40px 30px;
            border-radius: 48px 48px 32px 32px;
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.7),
                inset 0 1px 4px rgba(180, 210, 160, 0.3);
            border: 1px solid #4d6b4a;
            position: relative;
        }

        /* эффект складок шторки */
        .curtain::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(90deg,
                rgba(0,0,0,0.08) 0px,
                rgba(0,0,0,0.08) 4px,
                transparent 4px,
                transparent 12px,
                rgba(255,255,240,0.03) 12px,
                rgba(255,255,240,0.03) 16px,
                transparent 16px,
                transparent 24px
            );
            border-radius: 48px 48px 32px 32px;
            pointer-events: none;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 24px 20px;
            position: relative;
            z-index: 2;
        }

        /* карточка номера — квадрат */
        .number-card {
            background: #2b3d2c;
            background-image: radial-gradient(circle at 20% 30%, #3b5a3a, #1d2f1e);
            aspect-ratio: 1 / 1;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 8px;
            box-shadow: 
                0 8px 0 #0f1f12,
                0 12px 20px rgba(0,0,0,0.6),
                inset 0 -2px 4px rgba(0,0,0,0.4),
                inset 0 2px 4px rgba(200, 230, 180, 0.2);
            border: 1px solid #5f7a55;
            transition: all 0.15s ease;
            text-align: center;
            color: #f0f5ea;
            text-shadow: 0 2px 3px #0a1a0b;
            position: relative;
        }

        .number-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 0 #0f1f12, 0 18px 28px rgba(0,0,0,0.8);
            border-color: #8fb07a;
        }

        /* флаг — emoji или символ */
        .flag {
            font-size: 3.8rem;
            line-height: 1.2;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.5));
            margin-bottom: 2px;
        }

        .country-name {
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            background: rgba(0,0,0,0.3);
            padding: 4px 10px;
            border-radius: 40px;
            backdrop-filter: blur(2px);
            margin-top: 2px;
            border: 1px solid #5b784b;
            color: #e2f0d6;
        }

        .price {
            font-size: 1.15rem;
            font-weight: 700;
            background: #142015;
            padding: 4px 14px;
            border-radius: 40px;
            margin: 8px 0 10px 0;
            border: 1px solid #7d9f6b;
            box-shadow: inset 0 1px 4px #a9c795;
            color: #f5ffe0;
            letter-spacing: 0.5px;
        }

        .buy-btn {
            background: #0f2b0e;
            border: none;
            border-bottom: 4px solid #4f7840;
            color: #f0fce8;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 8px 12px;
            border-radius: 60px;
            width: 80%;
            max-width: 140px;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 0 4px 0 #1a3319, inset 0 1px 4px #b5dba0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: inherit;
            margin-top: 2px;
        }

        .buy-btn:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
            box-shadow: 0 1px 0 #1a3319;
        }

        .buy-btn:hover {
            background: #1d421b;
            border-bottom-color: #6fa358;
            color: white;
        }

        /* адаптив */
        @media (max-width: 600px) {
            .curtain {
                padding: 20px 16px;
                border-radius: 32px;
            }
            .flag {
                font-size: 2.8rem;
            }
            .country-name {
                font-size: 0.7rem;
            }
            .price {
                font-size: 0.95rem;
                padding: 2px 10px;
            }
            .buy-btn {
                font-size: 0.9rem;
                padding: 6px 8px;
                width: 90%;
            }
            .number-card {
                border-radius: 20px;
            }
        }

        /* маленькие карточки */
        @media (max-width: 450px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }
        }

        /* тг ссылка скрыта, но используется в кнопках */
        .tg-link {
            display: none;
        }

        /* декоративный заголовок (по желанию) */
        .shop-title {
            text-align: center;
            color: #d6e8c9;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 28px;
            font-size: 1.8rem;
            text-shadow: 0 2px 8px #0d1f0b;
            border-bottom: 1px solid #4d6b44;
            padding-bottom: 12px;
            position: relative;
            z-index: 2;
        }
        .shop-title span {
            background: #253f26;
            padding: 0 20px;
            border-radius: 60px;
            border: 1px solid #618553;
        }
    </style>
</head>
<body>
    <div class="curtain">
        <div class="shop-title">
            <span>✦ SIM-CARD MARKET ✦</span>
        </div>
        <div class="grid" id="cardGrid">
            <!-- данные подставятся через JS -->
        </div>
    </div>

    <script>
        (function() {
            // ----- ДАННЫЕ НОМЕРОВ -----
            const numbers = [
                { country: "Россия", flag: "🇷🇺", price: 120 },
                { country: "Венгрия", flag: "🇭🇺", price: 200 },
                { country: "Вьетнам", flag: "🇻🇳", price: 150 },
                { country: "Англия", flag: "🇬🇧", price: 160 },
                { country: "Япония", flag: "🇯🇵", price: 180 },
                { country: "Таиланд", flag: "🇹🇭", price: 110 },
                { country: "Провинция", flag: "🏴", price: 55 },   // условный флаг
                { country: "Сауд. Аравия", flag: "🇸🇦", price: 30 },
                { country: "Азербайджан", flag: "🇦🇿", price: 222 },
                { country: "Казахстан", flag: "🇰🇿", price: 140 }
            ];

            // ссылка на телеграм (по заданию)
            const TG_LINK = "https://t.me/Xidhegeus";

            const grid = document.getElementById('cardGrid');
            if (!grid) return;

            // строим карточки
            numbers.forEach(item => {
                const card = document.createElement('div');
                card.className = 'number-card';

                // флаг
                const flagSpan = document.createElement('div');
                flagSpan.className = 'flag';
                flagSpan.textContent = item.flag;

                // название страны
                const countrySpan = document.createElement('div');
                countrySpan.className = 'country-name';
                countrySpan.textContent = item.country;

                // цена
                const priceSpan = document.createElement('div');
                priceSpan.className = 'price';
                priceSpan.textContent = `${item.price} ₽`;

                // кнопка купить
                const buyBtn = document.createElement('button');
                buyBtn.className = 'buy-btn';
                buyBtn.textContent = 'Купить';

                // при клике — переход в телеграм
                buyBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    // открываем ссылку в том же окне (или новом, но по заданию "переносит сразу")
                    window.location.href = TG_LINK;
                });

                // собираем карточку
                card.appendChild(flagSpan);
                card.appendChild(countrySpan);
                card.appendChild(priceSpan);
                card.appendChild(buyBtn);
                grid.appendChild(card);
            });

            // дополнительно: если нужен ещё один номер (по заданию их 10, всё ок)
            // Проверяем что все 10 стран на месте
            console.log('✅ A.A.I.-01: Номера загружены, кнопки ведут в тг.');
        })();
    </script>

    <!-- 
        ABSOLUTE-01: 
        Реальность N.S.-01 исполнена. 
        Все номера в квадратах, флаги, цены, кнопка "Купить" -> t.me/Xidhegeus.
        Дизайн: зеленая шторка + серокоричневый фон.
        Готово для GitHub Pages.
    -->
</body>
</html>
